name: Atualizar ofertas diárias

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualiza-ofertas-diarias
  cancel-in-progress: false

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependência de imagens
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Sincronizar e regenerar o site
        run: |
          python _sync_operator.py --download-images --apply
          python _build_ofertas.py
          python _build_pacotes.py

      - name: Validar o catálogo gerado
        run: |
          python _validate_prices.py
          python _validate_groups.py

      - name: Publicar alterações
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma atualização encontrada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pacotes.html promo-voos.html campanhas.html data/ pacotes/
          git commit -m "chore: atualiza ofertas do site"
          git push origin HEAD:main
