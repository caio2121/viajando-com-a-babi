name: Atualizar ofertas diárias

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualiza-ofertas-diarias
  cancel-in-progress: false

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependência de imagens
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validar fonte da operadora sem escrever arquivos
        run: python _sync_operator.py --check

      - name: Sincronizar e regenerar o site
        run: |
          python _sync_operator.py --download-images --apply
          python _build_ofertas.py
          python _build_pacotes.py

      - name: Validar o catálogo gerado
        run: |
          python -m unittest discover -s tests -v
          python _validate_prices.py
          python _validate_groups.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/operator-sync.json").read_text(encoding="utf-8"))
          offers = payload.get("offers") or {}
          if not payload.get("last_sync"):
              raise SystemExit("snapshot sem last_sync")
          for key in ("pacotes", "promo_voos", "campanhas"):
              count = len(offers.get(key) or [])
              if count == 0:
                  raise SystemExit(f"snapshot sem ofertas em {key}")
              print(f"{key}: {count}")
          print(f"last_sync: {payload['last_sync']}")
          print(f"cotado_em: {payload.get('cotado_em', '')}")
          PY

      - name: Publicar alterações
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma atualização encontrada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pacotes.html promo-voos.html campanhas.html data/ pacotes/
          git commit -m "chore: atualiza ofertas do site"
          git push origin HEAD:main
