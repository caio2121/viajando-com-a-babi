<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>08</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:Nunito,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.canvas{position:relative;width:1080px;height:1350px;overflow:hidden}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}

.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.75) 100%)}
.frame{position:absolute;inset:0;padding:52px;display:flex;flex-direction:column}
.logo{width:100px;height:100px;align-self:flex-end;object-fit:contain;opacity:.95}
.spacer{flex:1}
.h1{font-size:100px;font-weight:800;line-height:.92;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.tag{margin-top:16px;font-size:28px;font-weight:700;max-width:860px;opacity:.95}
.rule{margin:22px 0;width:100%;height:1px;background:rgba(255,255,255,.35)}
.row{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}
.price{font-size:64px;font-weight:800}
.unit{font-size:20px;font-weight:800;letter-spacing:.14em;color:#9fe3df}
.date{font-size:22px;font-weight:800;letter-spacing:.12em}
.inc{margin-top:18px;list-style:none;display:flex;flex-wrap:wrap;gap:8px 20px}
.inc li{font-size:18px;font-weight:700;opacity:.9;display:flex;gap:8px}
.ck{color:#3AAFA9}
.cta{margin-top:22px;font-size:20px;font-weight:800;display:inline-flex;gap:10px;align-items:center}
.cta svg{color:#25D366}
.disc{margin-top:10px;font-size:14px;opacity:.55}

</style>
</head>
<body>

<article class="canvas">
  <img class="photo" src="file:///C:/Users/CaioA/Viajandocomababi/marketing/social/campaigns/2027/jericoacoara/assets/hero.png" alt="" />
  <div class="veil"></div>
  <div class="frame">
    <img class="logo" src="file:///C:/Users/CaioA/Viajandocomababi/marketing/social/brand/logo-vcb.png" alt="" />
    <div class="spacer"></div>
    <h1 class="h1">Jericoacoara</h1>
    <p class="tag">Dunas, lagoas e aquele astral de Jeri</p>
    <div class="rule"></div>
    <div class="row">
      <div><p class="price">R$ 2.790</p><p class="unit">POR PESSOA</p></div>
      <p class="date">08 A 13 MAI 2027</p>
    </div>
    <ul class="inc"><li><span class="ck">✓</span><span>Aéreo ida e volta</span></li><li><span class="ck">✓</span><span>Transfer ida e volta</span></li><li><span class="ck">✓</span><span>Hotel com café da manhã</span></li><li><span class="ck">✓</span><span>Passeios Leste e Oeste</span></li></ul>

    <p class="disc">Valor promocional sujeito à disponibilidade.</p>
  </div>
</article>

</body>
</html>
