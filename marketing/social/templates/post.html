<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }} | POST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ css_href }}" />
</head>
<body>
  <article class="canvas canvas--post{{ premium_class }}" data-format="post">
    <img class="photo" src="{{ photo_src }}" alt="{{ photo_alt }}" style="object-position: {{ object_position }};" />
    <div class="veil" aria-hidden="true"></div>
    <div class="frame">
      <header class="top">
        {{ eyebrow_html }}
        <img class="logo logo--top" src="{{ logo_src }}" alt="Viajando com a Babi" width="500" height="500" />
      </header>
      <div class="spacer"></div>
      <div class="content">
        {{ hotel_html }}
        <h1 class="destination">{{ destination_html }}</h1>
        <p class="tagline">{{ tagline }}</p>
        <div class="accent-line" aria-hidden="true"></div>

        <div class="price-block">
          <p class="price-value">{{ price_value }}</p>
          <p class="price-unit">{{ price_unit }}</p>
        </div>
        {{ payment_html }}

        <section class="includes-block">
          <h2 class="includes-title">O pacote inclui</h2>
          <ul class="includes">{{ includes_html }}</ul>
        </section>

        <p class="date">{{ date_display }}</p>

        <div class="cta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11 11 0 0 0 3.1 17.3L2 22l4.8-1.1A11 11 0 1 0 20.5 3.5zm-8.5 17a9.1 9.1 0 0 1-4.6-1.3l-.3-.2-2.9.7.7-2.8-.2-.3a9.1 9.1 0 1 1 7.3 3.9zm5-6.8c-.3-.1-1.6-.8-1.9-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7.4 7.4 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.4.1-.6l.4-.5.3-.4a.5.5 0 0 0 0-.5c0-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.5 11.5 0 0 0 4.4 3.9 15 15 0 0 0 1.5.5 3.6 3.6 0 0 0 1.6.1 2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.6-.3z"/></svg>
          {{ cta }}
        </div>
        {{ disclaimer_html }}
      </div>
    </div>
  </article>
</body>
</html>
