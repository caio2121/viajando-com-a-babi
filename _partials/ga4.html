  <!-- Google Analytics 4 + Consent Mode v2 -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var VCB_CONSENT_KEY = 'vcb_consent_analytics';
    var ga4Loaded = false;

    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });

    function scheduleLoadGA4() {
      if (ga4Loaded) return;
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGA4, { timeout: 3000 });
      } else {
        window.addEventListener('load', loadGA4);
      }
    }

    function loadGA4() {
      if (ga4Loaded) return;
      ga4Loaded = true;
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-WGDNTSY8WM';
      s.async = true;
      s.onload = function() {
        gtag('js', new Date());
        gtag('config', 'G-WGDNTSY8WM', { send_page_view: true });
      };
      document.head.appendChild(s);
    }

    function grantAnalyticsConsent() {
      try { localStorage.setItem(VCB_CONSENT_KEY, 'granted'); } catch (e) {}
      gtag('consent', 'update', {
        analytics_storage: 'granted',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      scheduleLoadGA4();
      var banner = document.getElementById('cookieBanner');
      if (banner) banner.hidden = true;
    }

    function denyAnalyticsConsent() {
      try { localStorage.setItem(VCB_CONSENT_KEY, 'denied'); } catch (e) {}
      gtag('consent', 'update', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      var banner = document.getElementById('cookieBanner');
      if (banner) banner.hidden = true;
    }

    window.VCBConsent = {
      grant: grantAnalyticsConsent,
      deny: denyAnalyticsConsent,
      key: VCB_CONSENT_KEY
    };

    try {
      var stored = localStorage.getItem(VCB_CONSENT_KEY);
      if (stored === 'granted') {
        gtag('consent', 'update', {
          analytics_storage: 'granted',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
        scheduleLoadGA4();
      } else if (stored === 'denied') {
        denyAnalyticsConsent();
      }
    } catch (e) {}
  </script>
