  <!-- Google Analytics 4 + Google Ads + Consent Mode v2 -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var VCB_ADS_CONVERSION = 'AW-18242129651/_fe6COee7sscEPOdw_pD';

    function gtag_report_conversion(url) {
      var targetUrl = url;
      var callback = function () {
        if (typeof targetUrl !== 'undefined' && targetUrl) {
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        }
      };
      if (typeof gtag !== 'function') {
        callback();
        return false;
      }
      gtag('event', 'conversion', {
        send_to: VCB_ADS_CONVERSION,
        value: 1.0,
        currency: 'BRL',
        event_callback: callback
      });
      return false;
    }
    window.gtag_report_conversion = gtag_report_conversion;

    var VCB_CONSENT_KEY = 'vcb_consent_analytics';
    var VCB_GA4_ID = 'G-WGDNTSY8WM';
    var VCB_ADS_ID = 'AW-18242129651';
    var ga4Loaded = false;

    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });

    function scheduleLoadGA4() {
      if (ga4Loaded) return;
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGA4, { timeout: 3000 });
      } else {
        window.addEventListener('load', loadGA4);
      }
    }

    function loadGA4() {
      if (ga4Loaded) return;
      ga4Loaded = true;
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + VCB_GA4_ID;
      s.async = true;
      s.onload = function() {
        gtag('js', new Date());
        gtag('config', VCB_GA4_ID, { send_page_view: true });
        gtag('config', VCB_ADS_ID);
      };
      document.head.appendChild(s);
    }

    function grantGrantedConsent() {
      return {
        analytics_storage: 'granted',
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      };
    }

    function grantAnalyticsConsent() {
      try { localStorage.setItem(VCB_CONSENT_KEY, 'granted'); } catch (e) {}
      gtag('consent', 'update', grantGrantedConsent());
      scheduleLoadGA4();
      var banner = document.getElementById('cookieBanner');
      if (banner) banner.hidden = true;
    }

    function denyAnalyticsConsent() {
      try { localStorage.setItem(VCB_CONSENT_KEY, 'denied'); } catch (e) {}
      gtag('consent', 'update', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      var banner = document.getElementById('cookieBanner');
      if (banner) banner.hidden = true;
    }

    window.VCBConsent = {
      grant: grantAnalyticsConsent,
      deny: denyAnalyticsConsent,
      key: VCB_CONSENT_KEY
    };

    try {
      var stored = localStorage.getItem(VCB_CONSENT_KEY);
      if (stored === 'granted') {
        gtag('consent', 'update', grantGrantedConsent());
        scheduleLoadGA4();
      } else if (stored === 'denied') {
        denyAnalyticsConsent();
      }
    } catch (e) {}
  </script>
