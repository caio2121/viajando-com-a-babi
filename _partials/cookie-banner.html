  <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookies e privacidade" aria-live="polite" hidden>
    <div class="cookie-banner__inner container">
      <p class="cookie-banner__text">Usamos cookies de analytics (Google Analytics) e de publicidade (Google Ads) para medir visitas e campanhas, sem enviar dados pessoais dos formulários. <a href="privacidade.html">Política de privacidade</a></p>
      <div class="cookie-banner__actions">
        <button type="button" class="btn btn--md cookie-banner__accept" id="cookieAccept">Aceitar cookies</button>
        <button type="button" class="btn btn--outline btn--md cookie-banner__reject" id="cookieReject">Recusar</button>
      </div>
    </div>
  </div>
  <script>
    (function initCookieBanner() {
      var banner = document.getElementById('cookieBanner');
      if (!banner) return;
      var key = (window.VCBConsent && window.VCBConsent.key) || 'vcb_consent_analytics';
      try {
        if (localStorage.getItem(key)) {
          banner.hidden = true;
          return;
        }
      } catch (e) {}
      banner.hidden = false;
      var accept = document.getElementById('cookieAccept');
      var reject = document.getElementById('cookieReject');
      accept && accept.addEventListener('click', function () {
        window.VCBConsent && window.VCBConsent.grant();
      });
      reject && reject.addEventListener('click', function () {
        window.VCBConsent && window.VCBConsent.deny();
      });
    })();
  </script>
