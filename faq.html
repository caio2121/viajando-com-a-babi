  <script>
    (function initCookieBanner() {
      var banner = document.getElementById('cookieBanner');
      if (!banner) return;
      var key = (window.VCBConsent && window.VCBConsent.key) || 'vcb_consent_analytics';
      try {
        if (localStorage.getItem(key)) {
          banner.hidden = true;
          return;
        }
      } catch (e) {}
      banner.hidden = false;
      var accept = document.getElementById('cookieAccept');
      var reject = document.getElementById('cookieReject');
      accept && accept.addEventListener('click', function () {
        window.VCBConsent && window.VCBConsent.grant();
      });
      reject && reject.addEventListener('click', function () {
